name: Publish 砚芽 · 玄境

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "yanya-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check chat, MCP, migration and voice
        run: |
          node --check chat-next.js
          node --check library.js
          node --check mcp.js
          node --check data-hub.js
          node --check voice.js
          node --check theme.js
          node --check personal-assets.js
          node --check attachments.js
          node tests/chat-integration.cjs
          node tests/mcp-data.cjs
          node tests/voice.cjs
          node tests/theme.cjs
          node tests/personal-assets.cjs
          node tests/attachments.cjs
          node tests/chat-attachments.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
